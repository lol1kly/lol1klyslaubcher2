name: Build BlockLaunch for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BlockLaunch main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BlockLaunch-Windows
          path: dist/BlockLaunch.exe
